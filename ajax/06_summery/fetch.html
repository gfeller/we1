<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fetch() demo</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    button { font-size: 1.1rem; padding: 0.5rem 1rem; margin-right: 1rem; }
    p { max-width: 40rem; color: #444; }
    #status { font-weight: bold; }
    ul { max-width: 40rem; }
    li { margin-bottom: 0.3rem; }
    li.done { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <h1>fetch() demo</h1>
  <button id="btn-load">load todos</button>

  <p id="status"></p>
  <ul id="todo-list"></ul>

  <script src="index.js" type="module"></script>
</body>
</html>
